  <body>
    <!-- Decodes the redirect from 404.html back into a real path, before React Router mounts -->
    <script>
      (function (l) {
        if (l.search[1] === "p" && l.search.indexOf("=/") === 2) {
          var decoded = l.search.slice(3).split("&q=");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded[0].replace(/~and~/g, "&") +
              (decoded[1] ? "?" + decoded[1].replace(/~and~/g, "&") : "") +
              l.hash
          );
        }
      })(window.location);
    </script>
