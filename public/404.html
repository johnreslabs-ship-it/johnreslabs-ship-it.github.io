<!doctype html>
<!--
  GitHub Pages doesn't support server-side rewrites for client-side routing.
  This is the standard workaround (https://github.com/rafgraph/spa-github-pages):
  GitHub serves this file for any unknown path, and it redirects back to index.html
  with the original path encoded in a query param, which main index.html then decodes.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>Johnres Lab</title>
    <script>
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?p=/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&q=" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
